# Configuración del Worker de la clasificación online
name = "nini-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# Cambia esta URL por la de tu web en Cloudflare Pages (p. ej. https://operacion-nini.pages.dev)
[vars]
ALLOWED_ORIGIN = "https://operacion-nini.pages.dev"

# Crea el namespace con: npx wrangler kv namespace create SCORES
# y pega aquí el id que te devuelve.
[[kv_namespaces]]
binding = "SCORES"
id = "PEGAR_AQUI_EL_ID_DEL_KV"
